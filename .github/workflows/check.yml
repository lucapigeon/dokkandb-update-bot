name: Check DokkanDB

on:
  schedule:
    - cron: "7,37 * * * *"
      timezone: "Europe/Rome"
    - cron: "30/5 2 * * *"
      timezone: "Europe/Rome"
    - cron: "0,5,10,15,20,25,30 3 * * *"
      timezone: "Europe/Rome"
    - cron: "30,35,40,45,50,55 6 * * *"
      timezone: "Europe/Rome"
    - cron: "0,5,10,15,20,25,30 7 * * *"
      timezone: "Europe/Rome"
    - cron: "30 15 * * *"
      timezone: "Europe/Rome"
    - cron: "30 19 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia un messaggio di prova invece di controllare DokkanDB"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dokkandb-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check pages and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python monitor.py --test-telegram
          else
            python monitor.py
          fi
      - name: Save comparison baseline
        if: always()
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet -- state.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update DokkanDB monitor baseline"
              git push
            fi
          else
            echo "state.json non creato; nessuno stato da salvare."
          fi
