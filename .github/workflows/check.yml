name: Check DokkanDB

on:
  # L'avvio temporale è gestito da cron-job.org tramite workflow_dispatch.
  # Questo workflow non contiene uno schedule GitHub, così non duplica gli avvii esterni.
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Invia solo un test Telegram'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests cryptography
          playwright install --with-deps chromium

      - name: Esegui monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL }}
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
        run: |
          if [ "${{ github.event.inputs.test_telegram }}" == "true" ]; then
            python monitor.py --test-telegram
          else
            python monitor.py
          fi

      - name: Salva Screenshot in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
          retention-days: 3

      - name: Commit state.json
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -f state.json ]; then
            git add state.json
            git commit -m "Update state.json" || echo "Nessuna modifica a state.json"
            git pull --rebase origin main || true
            git push
          fi
